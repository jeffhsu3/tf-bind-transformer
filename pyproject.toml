[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tf-bind-transformer"
version = "0.0.118"
description = "Transformer for Transcription Factor Binding"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Phil Wang", email = "lucidrains@gmail.com"}
]
keywords = [
    "artificial intelligence",
    "deep learning",
    "attention mechanism",
    "transformers",
    "transcription factors",
    "gene expression"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.8"
dependencies = [
    "bidirectional-cross-attention",
    "biopython",
    "click",
    "einops>=0.3",
    "enformer-pytorch>=0.5",
    "fair-esm",
    "logavgexp-pytorch",
    "polars",
    "python-dotenv",
    "sentencepiece",
    "scikit-learn",
    "pybedtools",
    "torch>=1.6",
    "transformers>=4.0",
    "tqdm",
    "pyBigWig",
    "intervaltree",
    "pyfaidx",
]

[project.urls]
Homepage = "https://github.com/lucidrains/tf-bind-transformer"
Repository = "https://github.com/lucidrains/tf-bind-transformer"

[project.optional-dependencies]
dev = [
    "ruff",
    "pre-commit",
    "pytest",
    "rich",
    "pytest",
]

[tool.setuptools.packages.find]
exclude = ["tests*"]

[tool.ruff]
target-version = "py38"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "B904",  # raise without from
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]

[tool.ruff.isort]
known-first-party = ["tf_bind_transformer"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
